# ============================================================================
# AMBIENTE DE PRODUÇÃO - application-prod.properties
# ============================================================================
#
# ⚠️ ATENÇÃO: Este arquivo contém configurações para PRODUÇÃO!
# ⚠️ Nunca commitar credenciais reais! Use variáveis de ambiente.
#
# Ativar com: --spring.profiles.active=prod
# ============================================================================

# ============================================================================
# CONFIGURAÇÕES BÁSICAS
# ============================================================================
server.port=${PORT:8080}

# ============================================================================
# BANCO DE DADOS (PostgreSQL - via variáveis de ambiente)
# ============================================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/monetra_prod}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================================================
# JPA - Produção (valida schema, não altera)
# ============================================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ============================================================================
# LOGS - Nível INFO/ERROR em produção
# ============================================================================
logging.level.com.monetra=INFO
logging.level.org.springframework.web=WARNING
logging.level.org.springframework.security=WARNING

# Log para arquivo (opcional)
# logging.file.name=/var/log/monetra/app.log
# logging.file.max-size=10MB
# logging.file.max-history=7

# ============================================================================
# CORS - RESTRITO em produção (apenas domínios autorizados)
# ============================================================================
cors.allowed.origins=${CORS_ORIGINS:https://monetra.com,https://www.monetra.com}
cors.allow.credentials=true
cors.max.age=3600

# ============================================================================
# SEGURANÇA - Configurações JWT
# ============================================================================
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# ============================================================================
# PERFORMANCE
# ============================================================================
# Connection pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ============================================================================
# MONITORAMENTO (Spring Boot Actuator)
# ============================================================================
# management.endpoints.web.exposure.include=health,info,metrics
# management.endpoint.health.show-details=always