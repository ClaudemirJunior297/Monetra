# ==========================================
# Configuração do Spring Boot - Monetra Backend
# ==========================================

# Servidor
server.port=8080
server.servlet.context-path=/

# Nome da aplicação
spring.application.name=monetra-backend

# Banco de dados local persistente
spring.datasource.url=jdbc:h2:file:./data/monetra;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
spring.sql.init.schema-locations=file:./data/monetra.sql
spring.sql.init.encoding=UTF-8
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ==========================================
# Swagger / OpenAPI
# ==========================================
# URL do Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Habilita Swagger UI
springdoc.swagger-ui.enabled=true

# ==========================================
# Logging
# ==========================================
logging.level.root=INFO
logging.level.com.monetra=INFO
