# ==========================================
# Configuração do Spring Boot - Monetra Backend
# ==========================================

# Servidor
server.port=8080
server.servlet.context-path=/

# Nome da aplicação
spring.application.name=monetra-backend

# Banco de dados MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/monetra?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=monetra123
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
spring.sql.init.schema-locations=file:./data/monetra.sql
spring.sql.init.encoding=UTF-8
spring.jpa.open-in-view=false

# ==========================================
# Swagger / OpenAPI
# ==========================================
# URL do Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Habilita Swagger UI
springdoc.swagger-ui.enabled=true

# ==========================================
# Logging
# ==========================================
logging.level.root=INFO
logging.level.com.monetra=INFO
