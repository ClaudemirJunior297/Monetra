# ============================================================================
# AMBIENTE DE DESENVOLVIMENTO - application-dev.properties
# ============================================================================
#
# Este arquivo é ativado quando executamos com:
# --spring.profiles.active=dev
#
# Configurações específicas para ambiente de desenvolvimento.
# ============================================================================

# ============================================================================
# CONFIGURAÇÕES BÁSICAS
# ============================================================================
server.port=8080

# ============================================================================
# BANCO DE DADOS (H2 em memória - rápido para testes)
# ============================================================================
spring.datasource.url=jdbc:h2:mem:monetra_dev;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ============================================================================
# JPA - Desenvolvimento (cria e recria tabelas)
# ============================================================================
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ============================================================================
# LOGS - Nível DEBUG para desenvolvimento
# ============================================================================
logging.level.com.monetra=DEBUG
logging.level.org.springframework.web=DEBUG

# ============================================================================
# CONSOLE H2 (útil para debug)
# ============================================================================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ============================================================================
# CORS - Liberado para desenvolvimento
# ============================================================================
cors.allowed.origins=*
cors.allow.credentials=false

# ============================================================================
# MENSAGEM DE BOOT
# ============================================================================
spring.banner.charset=UTF-8