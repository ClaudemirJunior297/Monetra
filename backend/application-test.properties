# ============================================================================
# AMBIENTE DE TESTES - application-test.properties
# ============================================================================
#
# Configurações específicas para execução de testes automatizados.
# ============================================================================

# ============================================================================
# CONFIGURAÇÕES BÁSICAS
# ============================================================================
server.port=0

# ============================================================================
# BANCO DE DADOS (H2 em memória - isolado para testes)
# ============================================================================
spring.datasource.url=jdbc:h2:mem:monetra_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ============================================================================
# JPA - Testes (cria schema e mantém entre testes)
# ============================================================================
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ============================================================================
# LOGS - Reduzido para testes
# ============================================================================
logging.level.com.monetra=WARN
logging.level.org.springframework=WARN

# ============================================================================
# CONSOLE H2 - Desabilitado em testes
# ============================================================================
spring.h2.console.enabled=false